<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="robots" content="noindex, nofollow"/>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="apple-touch-icon" href="icon-192.png"/>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#0a0710"/>
  <title>Game History – JeetPatti</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .sum { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
    .filters { display: inline-flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
    .filters button { padding: 8px 16px; border-radius: 10px; border: none; background: none; color: var(--muted); font-family: var(--font); font-size: 13.5px; font-weight: 600; cursor: pointer; }
    .filters button.on { background: var(--surface-3); color: var(--text); }
    .h-list { display: flex; flex-direction: column; gap: 10px; }
    .h-row { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 16px; padding: 14px 16px; border-radius: 16px; background: rgba(255,255,255,.03); border: 1px solid var(--line); border-left-width: 3px; }
    .h-row.win { border-left-color: var(--emerald); }
    .h-row.loss { border-left-color: var(--ruby); }
    .h-n { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: 12.5px; font-weight: 700; color: var(--dim); background: var(--surface); }
    .h-info b { font-size: 15px; display: flex; align-items: center; gap: 8px; }
    .h-info span { display: block; color: var(--dim); font-size: 12.5px; margin-top: 3px; }
    .h-amt { text-align: right; }
    .h-amt b { font-size: 17px; font-weight: 800; display: block; }
    .h-amt span { font-size: 12px; color: var(--dim); }
    .h-row .mini-cards .pcard { --w: 36px; }
    .h-row .mini-cards .pcard .pc-s { font-size: 15px; padding-top: 12px; }
    @media (max-width: 760px) {
      .sum { grid-template-columns: 1fr 1fr; }
      .h-row { grid-template-columns: 1fr auto; gap: 10px 12px; }
      .h-n { display: none; }
      .h-row .mini-cards { grid-column: 1; }
      .h-amt { grid-row: 1; grid-column: 2; }
    }
  </style>
</head>
<body data-page="history">
<header id="topbar"></header>
<div class="app">
  <aside id="sidebar"></aside>
  <main class="main">
    <div class="page-head">
      <div>
        <h1>Game <span class="gold-text">History</span></h1>
        <p>Your last 30 games · <span class="hi">गेम इतिहास</span></p>
      </div>
      <div class="filters" id="filters">
        <button class="on" data-f="all">All</button>
        <button data-f="win">Wins</button>
        <button data-f="loss">Losses</button>
      </div>
    </div>
    <div class="sum">
      <div class="stat-card"><div class="stat-label"><i data-i="spade"></i>Games</div><div class="stat-value" id="s-games">0</div></div>
      <div class="stat-card"><div class="stat-label"><i data-i="trophy"></i>Wins</div><div class="stat-value" id="s-wins" style="color:var(--emerald-2)">0</div></div>
      <div class="stat-card"><div class="stat-label"><i data-i="x"></i>Losses</div><div class="stat-value" id="s-loss" style="color:var(--ruby-2)">0</div></div>
      <div class="stat-card"><div class="stat-label"><i data-i="chart"></i>Net</div><div class="stat-value" id="s-net">0</div></div>
    </div>
    <div id="history-wrap"><div class="spinner"></div></div>
  </main>
</div>
<nav id="tabbar"></nav>
<script src="js/ui.js"></script>
<script>
const token = localStorage.getItem('token');
if (!token) window.location.href = 'login.html';
let HIST = [];
const fmt = n => Math.abs(n).toLocaleString('en-IN');

function render(filter) {
  const wrap = document.getElementById('history-wrap');
  const list = HIST.map((h, i) => ({ h, i })).filter(x => filter === 'all' || x.h.result === filter);
  if (!list.length) {
    wrap.innerHTML = '<div class="panel empty"><div class="empty-ic">' + JP.icon('spade') + '</div><p>' + (HIST.length ? 'Nothing here yet.' : 'No games yet.') + '</p><a href="game.html" class="btn btn-ruby btn-sm" style="margin-top:14px">Play a game</a></div>';
    return;
  }
  wrap.innerHTML = '<div class="h-list">' + list.map(({ h, i }) => {
    const win = h.result === 'win';
    const amt = win ? h.chipsWon : h.chipsLost;
    const cards = (h.playerCards || []).length ? '<div class="mini-cards">' + h.playerCards.map(c => JP.card(c)).join('') + '</div>' : '<span class="muted">—</span>';
    return `<div class="h-row ${win ? 'win' : 'loss'}">
      <div class="h-n">#${i + 1}</div>
      <div class="h-info"><b><span class="badge ${win ? 'badge-green' : 'badge-red'}">${win ? 'WIN' : 'LOSS'}</span></b><span>${new Date(h.createdAt).toLocaleString('en-IN')}</span></div>
      ${cards}
      <div class="h-amt"><b style="color:${win ? 'var(--emerald-2)' : 'var(--ruby-2)'}">${amt > 0 ? (win ? '+' : '−') + '₹' + fmt(amt) : '—'}</b><span>Pot ₹${fmt(h.pot || 0)}</span></div>
    </div>`;
  }).join('') + '</div>';
}

document.querySelectorAll('#filters button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#filters button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); render(b.dataset.f);
}));

async function load() {
  try {
    JP.me().catch(() => {});
    const res = await fetch('/api/game/history', { headers: { 'Authorization': token } });
    HIST = await res.json();
    let wins = 0, won = 0, lost = 0;
    HIST.forEach(h => { if (h.result === 'win') { wins++; won += h.chipsWon || 0; } else lost += h.chipsLost || 0; });
    const net = won - lost;
    document.getElementById('s-games').textContent = HIST.length;
    document.getElementById('s-wins').textContent = wins;
    document.getElementById('s-loss').textContent = HIST.length - wins;
    const ne = document.getElementById('s-net');
    ne.textContent = (net > 0 ? '+' : net < 0 ? '−' : '') + fmt(net);
    ne.style.color = net > 0 ? 'var(--emerald-2)' : net < 0 ? 'var(--ruby-2)' : '';
    render('all');
  } catch (e) {
    document.getElementById('history-wrap').innerHTML = '<div class="panel empty">Could not load. Is the server running?</div>';
  }
}
load();
</script>
</body>
</html>
