<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="apple-touch-icon" href="icon-192.png"/>
  <meta name="theme-color" content="#0a0006"/>
  <title>Game History – JeetPatti</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<nav class="navbar">
  <a href="index.html" class="brand">♣ Jeet<span>Patti</span></a>
  <div class="nav-links">
    <a href="dashboard.html">Dashboard</a>
    <a href="game.html">Play</a>
  </div>
  <span class="nav-chips">🟡 <span id="nav-chips">0</span> Chips</span>
</nav>
<div style="max-width:900px;margin:0 auto;padding:40px 20px;">
  <h1 style="color:var(--gold);font-size:26px;margin-bottom:6px;">Game History / गेम इतिहास</h1>
  <p style="color:var(--gray);margin-bottom:28px;">Your last 30 games</p>
  <div id="history-wrap" style="background:var(--green-mid);border:1px solid rgba(240,192,64,0.15);border-radius:20px;padding:24px;">
    <div class="spinner"></div>
  </div>
</div>
<script>
const token = localStorage.getItem('token');
if (!token) window.location.href = 'login.html';
async function load() {
  try {
    const r1 = await fetch('/api/auth/me', { headers: { 'Authorization': token } });
    const user = await r1.json();
    document.getElementById('nav-chips').textContent = user.chips.toLocaleString();
    const res = await fetch('/api/game/history', { headers: { 'Authorization': token } });
    const history = await res.json();
    if (!history.length) {
      document.getElementById('history-wrap').innerHTML = '<p style="color:var(--gray);text-align:center;padding:30px;">No games yet. <a href="game.html" style="color:var(--gold)">Play your first game!</a></p>';
      return;
    }
    document.getElementById('history-wrap').innerHTML = `
      <table class="data-table">
        <thead><tr><th>#</th><th>Date & Time</th><th>Result</th><th>Your Cards</th><th>Chips Won</th><th>Chips Lost</th><th>Pot</th></tr></thead>
        <tbody>${history.map((h, i) => `
          <tr>
            <td style="color:var(--gray)">${i + 1}</td>
            <td style="color:var(--gray);font-size:12px">${new Date(h.createdAt).toLocaleString('en-IN')}</td>
            <td><span class="badge ${h.result === 'win' ? 'badge-green' : 'badge-red'}">${h.result === 'win' ? '✅ WIN' : '❌ LOSS'}</span></td>
            <td style="font-size:12px;color:var(--gray)">${(h.playerCards || []).join(', ') || '-'}</td>
            <td style="color:var(--green-glow);font-weight:600">${h.chipsWon > 0 ? '+' + h.chipsWon : '-'}</td>
            <td style="color:#ef9a9a">${h.chipsLost > 0 ? '-' + h.chipsLost : '-'}</td>
            <td style="color:var(--gold)">${h.pot || 0}</td>
          </tr>`).join('')}
        </tbody>
      </table>`;
  } catch(e) {
    document.getElementById('history-wrap').innerHTML = '<p style="color:var(--gray);text-align:center;padding:20px;">Could not load. Is server running?</p>';
  }
}
load();
</script>
</body>
</html>
