<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="apple-touch-icon" href="icon-192.png"/>
  <meta name="theme-color" content="#0a0006"/>
  <title>Register – JeetPatti</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px 16px; background: radial-gradient(ellipse 60% 50% at 50% 30%, rgba(26,90,26,0.4) 0%, transparent 70%); }
    .auth-box { width: 100%; max-width: 440px; }
    .auth-logo { text-align: center; margin-bottom: 24px; }
    .auth-logo a { font-family: 'Cinzel', serif; font-size: 26px; color: var(--gold); text-decoration: none; }
    .auth-logo p { color: var(--gray); font-size: 13px; margin-top: 5px; }
    .bonus-badge { background: rgba(240,192,64,0.1); border: 1px solid var(--gold-dark); border-radius: var(--radius); padding: 10px 14px; text-align: center; color: var(--gold-light); font-size: 13px; margin-bottom: 20px; }
    .divider { display: flex; align-items: center; gap: 14px; margin: 14px 0; color: var(--gray); font-size: 13px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.1); }
  </style>
</head>
<body>
<nav class="navbar">
  <a href="index.html" class="brand">♣ Jeet<span>Patti</span></a>
  <div class="nav-links"><a href="login.html">Login</a><a href="index.html">Home</a></div>
  <button class="hamburger" onclick="toggleMenu()"><span></span><span></span><span></span></button>
</nav>
<div class="mobile-menu" id="mobile-menu">
  <a href="index.html"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.15em"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg> Home</a>
  <a href="login.html"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.15em"><circle cx="8" cy="15" r="4"/><path d="M10.85 12.15L21 2M18 5l2 2M15 8l2 2"/></svg> Already have account? Login</a>
</div>
<nav class="bottom-nav">
  <a href="index.html"><span class="bn-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.15em"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg></span>Home</a>
  <a href="login.html"><span class="bn-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.15em"><circle cx="8" cy="15" r="4"/><path d="M10.85 12.15L21 2M18 5l2 2M15 8l2 2"/></svg></span>Login</a>
  <a href="register.html" class="active"><span class="bn-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.15em"><path d="M12 2l3 6.5 7 .9-5 4.8 1.3 7L12 18l-6.3 3.2L7 14.2l-5-4.8 7-.9z"/></svg></span>Register</a>
</nav>

<div class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">
      <a href="index.html">♣ JeetPatti</a>
      <p>Create your account / अकाउंट बनाएं</p>
    </div>
    <div class="bonus-badge"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.15em"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M5 12v9h14v-9"/><path d="M12 8C12 8 11 3 8 3a2.5 2.5 0 0 0 0 5zM12 8c0 0 1-5 4-5a2.5 2.5 0 0 1 0 5z"/></svg> Register now and get <strong>100 FREE chips</strong> instantly!<br><small>अभी जुड़ें और 100 फ्री चिप्स पाएं!</small></div>
    <div class="card">
      <div id="alert-box"></div>
      <div class="form-group"><label>Full Name / पूरा नाम</label><input type="text" id="name" placeholder="Your full name"/></div>
      <div class="form-group"><label>Email / ईमेल</label><input type="email" id="email" placeholder="yourname@email.com"/></div>
      <div class="form-group"><label>Mobile / मोबाइल</label><input type="tel" id="phone" placeholder="10-digit mobile number"/></div>
      <div class="form-group"><label>Password / पासवर्ड</label><input type="password" id="password" placeholder="Minimum 6 characters"/></div>
      <div class="form-group"><label>Confirm Password</label><input type="password" id="confirm-password" placeholder="Re-enter password"/></div>
      <button class="btn btn-gold btn-full" onclick="register()" id="reg-btn">Create Account / अकाउंट बनाएं</button>
      <div class="divider">or / या</div>
      <p style="text-align:center;font-size:13px;color:var(--gray);">Already have account? <a href="login.html" style="color:var(--gold);text-decoration:none;">Login here</a></p>
    </div>
    <p style="text-align:center;font-size:11px;color:var(--gray);margin-top:14px;">By registering you agree to our Terms. 18+ only.</p>
  </div>
</div>
<div id="toast"></div>
<script>
function toggleMenu(){document.getElementById('mobile-menu').classList.toggle('open');}
document.addEventListener('click',function(e){const m=document.getElementById('mobile-menu');if(!m.contains(e.target)&&!document.querySelector('.hamburger').contains(e.target))m.classList.remove('open');});
function showAlert(msg,type){document.getElementById('alert-box').innerHTML='<div class="alert alert-'+type+'">'+msg+'</div>';}
function showToast(msg){const t=document.getElementById('toast');t.innerHTML=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
async function register(){
  const name=document.getElementById('name').value.trim();
  const email=document.getElementById('email').value.trim();
  const phone=document.getElementById('phone').value.trim();
  const password=document.getElementById('password').value;
  const confirm=document.getElementById('confirm-password').value;
  if(!name||!email||!phone||!password)return showAlert('Please fill all fields / सभी जानकारी भरें','error');
  if(password.length<6)return showAlert('Password must be at least 6 characters','error');
  if(password!==confirm)return showAlert('Passwords do not match','error');
  if(!/^\d{10}$/.test(phone))return showAlert('Enter valid 10-digit mobile number','error');
  const btn=document.getElementById('reg-btn');btn.textContent='Creating...';btn.disabled=true;
  try{
    const res=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,phone,password})});
    const data=await res.json();
    if(!res.ok){showAlert(data.error||'Registration failed','error');btn.textContent='Create Account';btn.disabled=false;return;}
    localStorage.setItem('token',data.token);localStorage.setItem('user',JSON.stringify(data.user));
    showToast('<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.15em"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/></svg> Welcome! You got 100 free chips!');
    setTimeout(()=>window.location.href='dashboard.html',1500);
  }catch(e){showAlert('Server error. Please try again.','error');btn.textContent='Create Account';btn.disabled=false;}
}
document.addEventListener('keypress',e=>{if(e.key==='Enter')register();});
</script>
</body>
</html>
