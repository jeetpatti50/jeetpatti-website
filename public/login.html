<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Login – JeetPatti</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px 16px; background: radial-gradient(ellipse 60% 50% at 50% 30%, rgba(26,90,26,0.4) 0%, transparent 70%); }
    .auth-box { width: 100%; max-width: 420px; }
    .auth-logo { text-align: center; margin-bottom: 28px; }
    .auth-logo a { font-family: 'Cinzel', serif; font-size: 28px; color: var(--gold); text-decoration: none; }
    .auth-logo p { color: var(--gray); font-size: 14px; margin-top: 6px; }
    .divider { display: flex; align-items: center; gap: 14px; margin: 16px 0; color: var(--gray); font-size: 13px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.1); }
  </style>
</head>
<body>
<nav class="navbar">
  <a href="index.html" class="brand">♣ Jeet<span>Patti</span></a>
  <div class="nav-links"><a href="register.html">Register</a><a href="index.html">Home</a></div>
  <button class="hamburger" onclick="toggleMenu()"><span></span><span></span><span></span></button>
</nav>
<div class="mobile-menu" id="mobile-menu">
  <a href="index.html">🏠 Home</a>
  <a href="register.html">✨ Create Free Account</a>
</div>
<nav class="bottom-nav">
  <a href="index.html"><span class="bn-icon">🏠</span>Home</a>
  <a href="login.html" class="active"><span class="bn-icon">🔑</span>Login</a>
  <a href="register.html"><span class="bn-icon">✨</span>Register</a>
</nav>

<div class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">
      <a href="index.html">♣ JeetPatti</a>
      <p>Welcome back! / वापस आए!</p>
    </div>
    <div class="card">
      <div id="alert-box"></div>
      <div class="form-group"><label>Email / ईमेल</label><input type="email" id="email" placeholder="yourname@email.com"/></div>
      <div class="form-group"><label>Password / पासवर्ड</label><input type="password" id="password" placeholder="Enter your password"/></div>
      <button class="btn btn-gold btn-full" onclick="login()" id="login-btn">Login / लॉगिन करें</button>
      <div class="divider">or / या</div>
      <p style="text-align:center;font-size:14px;color:var(--gray);">New here? <a href="register.html" style="color:var(--gold);text-decoration:none;">Create free account</a></p>
    </div>
  </div>
</div>
<div id="toast"></div>
<script>
function toggleMenu(){document.getElementById('mobile-menu').classList.toggle('open');}
document.addEventListener('click',function(e){const m=document.getElementById('mobile-menu');if(!m.contains(e.target)&&!document.querySelector('.hamburger').contains(e.target))m.classList.remove('open');});
function showAlert(msg,type){document.getElementById('alert-box').innerHTML='<div class="alert alert-'+type+'">'+msg+'</div>';}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
async function login(){
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  if(!email||!password)return showAlert('Please enter email and password','error');
  const btn=document.getElementById('login-btn');btn.textContent='Logging in...';btn.disabled=true;
  try{
    const res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const data=await res.json();
    if(!res.ok){showAlert(data.error||'Login failed','error');btn.textContent='Login';btn.disabled=false;return;}
    localStorage.setItem('token',data.token);localStorage.setItem('user',JSON.stringify(data.user));
    showToast('✅ Login successful!');
    setTimeout(()=>window.location.href='dashboard.html',1200);
  }catch(e){showAlert('Server error. Please try again.','error');btn.textContent='Login';btn.disabled=false;}
}
document.addEventListener('keypress',e=>{if(e.key==='Enter')login();});
if(localStorage.getItem('token'))window.location.href='dashboard.html';
</script>
</body>
</html>
