<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="robots" content="noindex, nofollow"/>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="apple-touch-icon" href="icon-192.png"/>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#0a0710"/>
  <title>My Profile – JeetPatti</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .p-hero { position: relative; overflow: hidden; display: flex; align-items: center; gap: 18px; padding: 24px; border-radius: var(--radius-lg); margin-bottom: 16px; border: 1px solid var(--line-gold); background: radial-gradient(ellipse at 100% 0%, rgba(225,29,72,.28), transparent 60%), linear-gradient(135deg, #1d1029, #120a1a); }
    .p-hero .cchip { position: absolute; right: -20px; bottom: -20px; --s: 100px; opacity: .4; }
    .p-hero h1 { font-size: clamp(22px, 3vw, 28px); font-weight: 900; }
    .p-hero p { color: var(--muted); font-size: 14px; margin-top: 4px; }
    .p-hero .chip-pill { margin-top: 12px; }
    .info-list { display: flex; flex-direction: column; }
    .info-row { display: flex; align-items: center; gap: 14px; padding: 14px 2px; border-bottom: 1px solid var(--line); }
    .info-row:last-child { border-bottom: 0; }
    .info-row .i-ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); color: var(--gold); flex-shrink: 0; }
    .info-row .i-k { font-size: 12.5px; color: var(--dim); }
    .info-row .i-v { font-size: 15px; font-weight: 600; margin-top: 2px; word-break: break-all; }
    .prof-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 16px; align-items: start; }
    @media (max-width: 960px) { .prof-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body data-page="profile">
<header id="topbar"></header>
<div class="app">
  <aside id="sidebar"></aside>
  <main class="main">
    <div class="p-hero">
      <div class="cchip gold"></div>
      <div class="avatar xl js-initial">P</div>
      <div style="min-width:0">
        <h1 class="js-name">Loading…</h1>
        <p>My Profile · <span class="hi">मेरी प्रोफाइल</span></p>
        <a href="buy-chips.html" class="chip-pill"><span class="coin">₹</span><span class="js-chips">—</span>&nbsp;chips</a>
      </div>
    </div>

    <div id="alert-box"></div>
    <div class="prof-grid">
      <div class="panel">
        <div class="panel-title"><i data-i="user"></i>Account Details</div>
        <div class="info-list">
          <div class="info-row"><div class="i-ic"><i data-i="user"></i></div><div><div class="i-k">Full Name</div><div class="i-v" id="p-name">—</div></div></div>
          <div class="info-row"><div class="i-ic"><i data-i="mail"></i></div><div><div class="i-k">Email</div><div class="i-v" id="p-email">—</div></div></div>
          <div class="info-row"><div class="i-ic"><i data-i="phone"></i></div><div><div class="i-k">Phone</div><div class="i-v" id="p-phone">—</div></div></div>
          <div class="info-row"><div class="i-ic"><i data-i="coins"></i></div><div><div class="i-k">Chip Balance</div><div class="i-v" id="p-chips" style="color:var(--gold)">—</div></div></div>
        </div>
        <button class="btn btn-ghost btn-full" style="margin-top:16px" onclick="logout()"><i data-i="logout"></i>Logout</button>
      </div>

      <div class="panel">
        <div class="panel-title"><i data-i="bank"></i>Bank Details for Withdrawal</div>
        <p style="color:var(--muted);font-size:13.5px;margin:-8px 0 18px;">Required to sell chips and receive money. <span class="hi">बैंक विवरण</span></p>
        <div class="form-group"><label for="bank-acc">Bank Account Number</label><div class="field"><i data-i="bank"></i><input type="text" id="bank-acc" inputmode="numeric" placeholder="Your bank account number"/></div></div>
        <div class="form-group"><label for="bank-ifsc">IFSC Code</label><div class="field"><i data-i="key"></i><input type="text" id="bank-ifsc" placeholder="e.g. HDFC0001234" style="text-transform:uppercase"/></div></div>
        <div class="form-group"><label for="bank-name">Account Holder Name</label><div class="field"><i data-i="user"></i><input type="text" id="bank-name" placeholder="Name as in bank"/></div></div>
        <button class="btn btn-gold btn-full btn-lg" onclick="saveBank()" id="save-btn"><i data-i="save"></i>Save Bank Details</button>
      </div>
    </div>
  </main>
</div>
<nav id="tabbar"></nav>
<div id="toast"></div>
<script src="js/ui.js"></script>
<script>
const token = localStorage.getItem('token');
if (!token) window.location.href = 'login.html';
const SAVE_LABEL = document.getElementById('save-btn').innerHTML;
function showAlert(msg, type) { document.getElementById('alert-box').innerHTML = '<div class="alert alert-' + type + '">' + msg + '</div>'; }
async function load() {
  let u;
  try { u = await JP.me(); } catch (e) { return logout(); }
  document.getElementById('p-name').textContent = u.name || '—';
  document.getElementById('p-email').textContent = u.email || '—';
  document.getElementById('p-phone').textContent = u.phone ? '+91 ' + u.phone : '—';
  document.getElementById('p-chips').textContent = u.chips.toLocaleString('en-IN') + ' chips';
  if (u.bankAccount) document.getElementById('bank-acc').value = u.bankAccount;
  if (u.ifscCode) document.getElementById('bank-ifsc').value = u.ifscCode;
  if (u.accountName) document.getElementById('bank-name').value = u.accountName;
}
async function saveBank() {
  const bankAccount = document.getElementById('bank-acc').value.trim();
  const ifscCode = document.getElementById('bank-ifsc').value.trim().toUpperCase();
  const accountName = document.getElementById('bank-name').value.trim();
  if (!bankAccount || !ifscCode || !accountName) return showAlert('Please fill all bank fields', 'error');
  document.getElementById('alert-box').innerHTML = '';
  const btn = document.getElementById('save-btn'); btn.textContent = 'Saving...'; btn.disabled = true;
  try {
    const res = await fetch('/api/auth/update-bank', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': token }, body: JSON.stringify({ bankAccount, ifscCode, accountName }) });
    const d = await res.json();
    if (d.success) JP.toast('Bank details saved!');
    else showAlert(d.error || 'Error', 'error');
  } catch (e) { showAlert('Server error', 'error'); }
  btn.innerHTML = SAVE_LABEL; btn.disabled = false;
}
load();
</script>
</body>
</html>
