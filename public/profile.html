<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow"/>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="apple-touch-icon" href="icon-192.png"/>
  <meta name="theme-color" content="#0a0006"/>
  <title>My Profile – JeetPatti</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<nav class="navbar">
  <a href="index.html" class="brand">♣ Jeet<span>Patti</span></a>
  <div class="nav-links">
    <a href="dashboard.html">Dashboard</a>
    <a href="game.html">Play</a>
  </div>
  <span class="nav-chips"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.15em"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.66 3.58 3 8 3s8-1.34 8-3V6"/><path d="M4 12v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"/></svg> <span id="nav-chips">0</span> Chips</span>
</nav>
<div style="max-width:600px;margin:0 auto;padding:40px 20px;">
  <h1 style="color:var(--gold);font-size:26px;margin-bottom:28px;">My Profile / मेरी प्रोफाइल</h1>
  <div id="alert-box"></div>
  <div class="card" style="margin-bottom:20px;">
    <div class="card-title">Account Details</div>
    <div class="form-group"><label>Full Name</label><input type="text" id="p-name" readonly style="opacity:0.6"/></div>
    <div class="form-group"><label>Email</label><input type="email" id="p-email" readonly style="opacity:0.6"/></div>
    <div class="form-group"><label>Phone</label><input type="tel" id="p-phone" readonly style="opacity:0.6"/></div>
    <div class="form-group"><label>Chip Balance</label><input type="text" id="p-chips" readonly style="opacity:0.6;color:var(--gold)"/></div>
  </div>
  <div class="card">
    <div class="card-title">Bank Details for Withdrawal / बैंक विवरण</div>
    <p style="color:var(--gray);font-size:13px;margin-bottom:16px;">Required to sell chips and receive money</p>
    <div class="form-group"><label>Bank Account Number</label><input type="text" id="bank-acc" placeholder="Your bank account number"/></div>
    <div class="form-group"><label>IFSC Code</label><input type="text" id="bank-ifsc" placeholder="e.g. HDFC0001234"/></div>
    <div class="form-group"><label>Account Holder Name</label><input type="text" id="bank-name" placeholder="Name as in bank"/></div>
    <button class="btn btn-gold btn-full" onclick="saveBank()" id="save-btn"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.15em"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg> Save Bank Details</button>
  </div>
</div>
<div id="toast"></div>
<script>
const token = localStorage.getItem('token');
if (!token) window.location.href = 'login.html';
function showToast(msg) { const t = document.getElementById('toast'); t.innerHTML = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }
function showAlert(msg, type) { document.getElementById('alert-box').innerHTML = '<div class="alert alert-' + type + '">' + msg + '</div>'; }
async function load() {
  const res = await fetch('/api/auth/me', { headers: { 'Authorization': token } });
  const u = await res.json();
  document.getElementById('p-name').value = u.name;
  document.getElementById('p-email').value = u.email;
  document.getElementById('p-phone').value = u.phone;
  document.getElementById('p-chips').value = u.chips.toLocaleString() + ' chips';
  document.getElementById('nav-chips').textContent = u.chips.toLocaleString();
  if (u.bankAccount) document.getElementById('bank-acc').value = u.bankAccount;
  if (u.ifscCode) document.getElementById('bank-ifsc').value = u.ifscCode;
  if (u.accountName) document.getElementById('bank-name').value = u.accountName;
}
async function saveBank() {
  const bankAccount = document.getElementById('bank-acc').value.trim();
  const ifscCode = document.getElementById('bank-ifsc').value.trim().toUpperCase();
  const accountName = document.getElementById('bank-name').value.trim();
  if (!bankAccount || !ifscCode || !accountName) return showAlert('Please fill all bank fields', 'error');
  const btn = document.getElementById('save-btn'); btn.textContent = 'Saving...'; btn.disabled = true;
  try {
    const res = await fetch('/api/auth/update-bank', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': token }, body: JSON.stringify({ bankAccount, ifscCode, accountName }) });
    const d = await res.json();
    if (d.success) showToast('<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.15em"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-5"/></svg> Bank details saved!');
    else showAlert(d.error || 'Error', 'error');
  } catch(e) { showAlert('Server error', 'error'); }
  btn.innerHTML = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.15em"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg> Save Bank Details'; btn.disabled = false;
}
load();
</script>
</body>
</html>
